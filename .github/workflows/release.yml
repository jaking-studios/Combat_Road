name: Build Android APK & Release

# Bump the number in VERSION (e.g. 1.1.0) and push to main — or push a
# tag like v1.2.0, or run it manually — to build the Android app with
# Capacitor and publish a GitHub Release containing:
#   • CombatRoad.apk         – install directly on Android
#   • CombatRoad-web.zip     – the full offline web app (open index.html)
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version info
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v$(tr -d ' \n' < VERSION)"
          NAME="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$(( ${MA:-1} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Collect web app into www/
        run: |
          mkdir -p build/www
          cp -r index.html sw.js manifest.webmanifest icons build/www/
          cd build/www && zip -qr ../../CombatRoad-web.zip .

      - name: Create Capacitor Android project
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "io.github.jaineil32624.combatroad",
            "appName": "Combat Road",
            "webDir": "www",
            "backgroundColor": "#08080f",
            "android": { "backgroundColor": "#08080f" },
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: App icons, splash & version
        working-directory: build/android
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os, glob
          from PIL import Image
          res = "app/src/main/res"
          icon = Image.open("../../icons/icon-1024.png").convert("RGBA")
          import shutil
          shutil.rmtree(os.path.join(res, "mipmap-anydpi-v26"), ignore_errors=True)
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              out = os.path.join(res, "mipmap-" + d); os.makedirs(out, exist_ok=True)
              im = icon.resize((s, s), Image.LANCZOS)
              for n in ("ic_launcher.png", "ic_launcher_round.png"): im.save(os.path.join(out, n))
              fg = os.path.join(out, "ic_launcher_foreground.png")
              if os.path.exists(fg): os.remove(fg)
          for f in glob.glob(os.path.join(res, "**", "splash.png"), recursive=True):
              w, h = Image.open(f).size; s = min(w, h) // 3
              bg = Image.new("RGB", (w, h), "#08080f")
              ic = icon.resize((s, s), Image.LANCZOS); bg.paste(ic, ((w - s) // 2, (h - s) // 2), ic)
              bg.save(f)
          print("icons + splash done")
          PY
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.code }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.name }}\"/" app/build.gradle
          grep -E "versionCode|versionName|applicationId" app/build.gradle

      - name: Keep the screen on while playing
        working-directory: build/android
        run: |
          set -eux
          F=$(find app/src/main/java -name MainActivity.java | head -n1)
          PKG=$(grep -m1 '^package ' "$F")
          cat > "$F" <<JAVA
          $PKG

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          JAVA
          cat "$F"

      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../CombatRoad.apk
          ls -la ../../CombatRoad.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Combat Road ${{ steps.ver.outputs.tag }}
          make_latest: true
          files: |
            CombatRoad.apk
            CombatRoad-web.zip
          body: |
            ## 🚗 Combat Road ${{ steps.ver.outputs.tag }} — neon car combat

            | | |
            |---|---|
            | 🤖 **Android** | Download **CombatRoad.apk** below → open it → allow *Install unknown apps* if asked |
            | 🌐 **Web** | Play at **https://jaineil32624.github.io/Combat_Road/** |
            | 💻 **Install as an app** | Open the website in Chrome/Edge → 📲 *Get the app* → *Install* |
            | 🍎 **iPhone / iPad** | Open the website in Safari → Share → *Add to Home Screen* |
            | 📦 **Offline zip** | Unzip **CombatRoad-web.zip** and open `index.html` |

            🔫 9 lasers · 👹 boss waves every 5 rounds · ⭐ power-ups · 🚗 5 cars + workshop upgrades · 🎮 keyboard, touch & gamepad · 🏆 local leaderboard — works offline, no account, no ads.
