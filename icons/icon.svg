<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1535"/>
      <stop offset="0.55" stop-color="#160a33"/>
      <stop offset="1" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="40" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a30"/>
      <stop offset="1" stop-color="#0e0e18"/>
    </linearGradient>
    <linearGradient id="body" x1="196" y1="250" x2="316" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5577"/>
      <stop offset="0.45" stop-color="#e0103f"/>
      <stop offset="1" stop-color="#7a0020"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="60" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="1" stop-color="#7dffc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="300" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ccff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <g clip-path="url(#tile)">
  <!-- perspective road -->
  <path d="M206 40 L306 40 L470 512 L42 512 Z" fill="url(#road)"/>
  <g filter="url(#soft2)" opacity=".9">
    <path d="M206 40 L42 512" stroke="#ff5a00" stroke-width="10"/>
    <path d="M306 40 L470 512" stroke="#ff5a00" stroke-width="10"/>
  </g>
  <path d="M206 40 L42 512" stroke="#ffb066" stroke-width="4"/>
  <path d="M306 40 L470 512" stroke="#ffb066" stroke-width="4"/>
  <g fill="#ffd400" opacity=".75">
    <path d="M252 52 h8 l2 26 h-12 z"/>
    <path d="M250 104 h12 l2 34 h-16 z"/>
    <path d="M248 168 h16 l3 44 h-22 z"/>
  </g>
  </g>
  <!-- laser beams -->
  <g filter="url(#soft)">
    <rect x="216" y="70" width="18" height="200" rx="9" fill="#00ff88" opacity=".85"/>
    <rect x="278" y="70" width="18" height="200" rx="9" fill="#00ff88" opacity=".85"/>
  </g>
  <rect x="220" y="64" width="10" height="206" rx="5" fill="url(#beam)"/>
  <rect x="282" y="64" width="10" height="206" rx="5" fill="url(#beam)"/>
  <!-- car shadow + glow -->
  <ellipse cx="256" cy="372" rx="92" ry="118" fill="#ff2244" opacity=".35" filter="url(#soft)"/>
  <!-- wheels -->
  <g fill="#141414">
    <rect x="178" y="282" width="26" height="50" rx="7"/>
    <rect x="308" y="282" width="26" height="50" rx="7"/>
    <rect x="178" y="396" width="26" height="50" rx="7"/>
    <rect x="308" y="396" width="26" height="50" rx="7"/>
  </g>
  <!-- body -->
  <rect x="190" y="254" width="132" height="214" rx="30" fill="url(#body)"/>
  <rect x="200" y="256" width="112" height="78" rx="24" fill="#ff3d63" opacity=".55"/>
  <!-- windshield / roof / rear window -->
  <rect x="210" y="330" width="92" height="40" rx="12" fill="#9fdcff" opacity=".85"/>
  <rect x="206" y="372" width="100" height="52" rx="14" fill="#5a0018" opacity=".55"/>
  <rect x="214" y="426" width="84" height="22" rx="8" fill="#9fdcff" opacity=".55"/>
  <!-- headlights -->
  <g filter="url(#soft2)">
    <rect x="202" y="262" width="36" height="16" rx="6" fill="#ffffaa"/>
    <rect x="274" y="262" width="36" height="16" rx="6" fill="#ffffaa"/>
  </g>
  <rect x="204" y="264" width="32" height="12" rx="5" fill="#ffffe0"/>
  <rect x="276" y="264" width="32" height="12" rx="5" fill="#ffffe0"/>
  <!-- laser emitter -->
  <rect x="240" y="236" width="32" height="22" rx="8" fill="#00ff88"/>
  <rect x="246" y="240" width="20" height="10" rx="4" fill="#d8ffee"/>
  <!-- tail lights -->
  <rect x="202" y="452" width="28" height="10" rx="4" fill="#ff3300"/>
  <rect x="282" y="452" width="28" height="10" rx="4" fill="#ff3300"/>
</svg>
